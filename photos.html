    <script src="photos-data.js"></script>
    <script>
      (function () {
        var grid = document.getElementById("photoGrid");
        var empty = document.getElementById("photoEmpty");
        var lb = document.getElementById("lightbox");
        var lbImg = document.getElementById("lbImg");
        var lbSource = document.getElementById("lbSource");
        var lbMeta = document.getElementById("lbMeta");
        if (!grid || !lb) return;

        var photos = [];
        var current = -1;
        var ORDER = ["camera", "lens", "focal", "aperture", "shutter", "iso", "location", "date"];

        function metaLine(m) {
          if (!m) return "";
          var parts = [];
          ORDER.forEach(function (k) {
            if (m[k]) parts.push(m[k]);
          });
          return parts.join("  ·  ");
        }

        function show(i) {
          var n = photos.length;
          if (!n) return;
          i = ((i % n) + n) % n;
          current = i;
          var p = photos[i];
          // the 1600px display tier, not the 4mb original. srcset has to be set
          // before src or the browser commits to the jpeg and skips the webp
          lbSource.srcset = p.displayWebp ? encodeURI(p.displayWebp) : "";
          lbImg.src = p.display || p.src;
          lbImg.alt = p.alt || "";
          var line = metaLine(p.meta);
          lbMeta.textContent = line;
          lbMeta.style.display = line ? "block" : "none";
          if (window.gtag) {
            gtag("event", "photo_view", {
              photo: (p.src || "").split("/").pop(),
              location: (p.meta && p.meta.location) || "unknown"
            });
          }
        }

        function open(i) {
          show(i);
          lb.classList.add("open");
          lb.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }

        function close() {
          lb.classList.remove("open");
          lb.setAttribute("aria-hidden", "true");
          document.body.style.overflow = "";
          lbImg.src = "";
        }

        // the figures are already in the HTML (generate-photos.py writes them),
        // so this only attaches the lightbox to what's there
        function bind(data) {
          photos = data || [];
          var imgs = grid.querySelectorAll(".photo-item img");
          if (!imgs.length) {
            empty.hidden = false;
            return;
          }
          Array.prototype.forEach.call(imgs, function (img, n) {
            var i = parseInt(img.getAttribute("data-index"), 10);
            if (isNaN(i)) i = n;
            img.style.cursor = "zoom-in";
            img.addEventListener("click", function () { open(i); });
          });
        }

        bind(window.PHOTOS || []);

        document.getElementById("lbClose").addEventListener("click", close);
        document.getElementById("lbNext").addEventListener("click", function (e) {
          e.stopPropagation();
          show(current + 1);
        });
        document.getElementById("lbPrev").addEventListener("click", function (e) {
          e.stopPropagation();
          show(current - 1);
        });
        lb.addEventListener("click", function (e) {
          if (e.target === lb || e.target.classList.contains("lightbox-figure")) close();
        });

        document.addEventListener("keydown", function (e) {
          if (!lb.classList.contains("open")) return;
          if (e.key === "Escape") close();
          else if (e.key === "ArrowRight") show(current + 1);
          else if (e.key === "ArrowLeft") show(current - 1);
        });
      })();
    </script>
  </body>
</html>
