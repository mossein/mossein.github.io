name: agent readiness

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: markdown twins are in sync with the html
        run: python3 scripts/build_markdown.py --check

      - name: static readiness checks
        run: python3 -m unittest discover -s tests -v

      - name: edge negotiation logic
        run: node --test
